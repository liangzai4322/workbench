const refresh = (form, id) => { document.getElementById(id).disabled = !form.checkValidity(); };

function openProjectDlg(mode){
  ctx = {mode};
  projectForm.reset();
  F(projectForm,'deadline').min = todayISO();
  const p = mode === 'goal' ? cur() : null;
  document.getElementById('projectDlgTitle').textContent = mode === 'create' ? '新建项目' : '设定总体目标';
  document.getElementById('fName').hidden = mode !== 'create';
  document.getElementById('fPlan').hidden = mode !== 'create';
  document.getElementById('fBlocker').hidden = mode !== 'create';
  F(projectForm,'name').required = mode === 'create';
  if(p){
    F(projectForm,'metric').value = p.goal?.metric || '';
    F(projectForm,'target').value = p.goal?.target ?? '';
    F(projectForm,'unit').value = p.goal?.unit || '';
    F(projectForm,'deadline').value = p.goal?.deadline || '';
    if(p.goal?.deadline && p.goal.deadline < todayISO()) F(projectForm,'deadline').min = '';
  }
  refresh(projectForm, 'projectSubmit');
  projectDlg.showModal();
  F(projectForm, mode === 'create' ? 'name' : 'target').focus();
}
function openStepDlg(mode){
  ctx = {mode};
  const p = cur();
  stepForm.reset();
  F(stepForm,'deadline').min = todayISO();
  document.getElementById('stepDlgTitle').textContent = mode === 'edit' ? '修改下一步' : '设定下一步';
  document.getElementById('stepLead').textContent = (mode === 'new' && p.history.length) ? '上一步完成了，趁热定下一步。三项都填了才能保存。' : '一次只定一步。三项都填了才能保存。';
  document.getElementById('stepDelete').hidden = mode !== 'edit';
  if(mode === 'edit' && p.current){
    F(stepForm,'what').value = p.current.what;
    F(stepForm,'result').value = p.current.result;
    F(stepForm,'deadline').value = p.current.deadline;
    if(p.current.deadline < todayISO()) F(stepForm,'deadline').min = '';
  }
  document.getElementById('resultWarn').hidden = true;
  refresh(stepForm, 'stepSubmit');
  stepDlg.showModal();
  F(stepForm,'what').focus();
}

projectForm.addEventListener('input', () => refresh(projectForm, 'projectSubmit'));
stepForm.addEventListener('input', () => {
  refresh(stepForm, 'stepSubmit');
  const v = F(stepForm,'result').value.trim();
  document.getElementById('resultWarn').hidden = !(v.length >= 6 && !/\d/.test(v));
});
document.querySelectorAll('[data-quick]').forEach(box => box.addEventListener('click', e => {
  const b = e.target.closest('button[data-days]'); if(!b) return;
  const form = box.closest('form');
  F(form,'deadline').value = addDays(todayISO(), +b.dataset.days);
  form.dispatchEvent(new Event('input'));
}));
document.querySelectorAll('dialog:not(#authDlg)').forEach(d => {
  d.addEventListener('click', e => { if(e.target === d) d.close(); });
  d.querySelectorAll('[data-close]').forEach(b => b.addEventListener('click', () => d.close()));
});

projectForm.addEventListener('submit', e => {
  e.preventDefault();
  if(!projectForm.reportValidity()) return;
  const metric = F(projectForm,'metric').value.trim(), deadline = F(projectForm,'deadline').value, t = todayISO();
  const target = parseFloat(F(projectForm,'target').value), unit = F(projectForm,'unit').value.trim();
  if(ctx.mode === 'create'){
    const p = {id:uid(), name:F(projectForm,'name').value.trim(), plan:F(projectForm,'plan').value.trim(), goal:{metric, target, unit, current:null, deadline, start:t}, roadmap:[], progress:'', progressUpdatedAt:t, blocker:F(projectForm,'blocker').value.trim(), current:null, history:[], notes:'', createdAt:t};
    projects.push(p); selectedId = p.id;
  } else {
    const p = cur();
    const keepStart = p.goal?.start && p.goal.deadline === deadline;
    p.goal = {metric, target, unit, current: p.goal?.current ?? null, deadline, start: keepStart ? p.goal.start : t};
  }
  projectDlg.close(); fx = true; save(); render();
  if(ctx.mode === 'create') window.scrollTo({top:0, behavior:'smooth'});
});
stepForm.addEventListener('submit', e => {
  e.preventDefault();
  if(!stepForm.reportValidity()) return;
  const p = cur();
  const data = {what:F(stepForm,'what').value.trim(), result:F(stepForm,'result').value.trim(), deadline:F(stepForm,'deadline').value};
  if(ctx.mode === 'edit' && p.current) Object.assign(p.current, data);
  else p.current = {id:uid(), ...data, createdAt:todayISO()};
  stepDlg.close(); fx = true; save(); render();
});
/* 更新完成量 */
const curDlg = document.getElementById('curDlg'), curForm = document.getElementById('curForm');
function openCurDlg(){
  const p = cur(); curForm.reset();
  F(curForm,'current').value = typeof p.goal.current === 'number' ? p.goal.current : '';
  document.getElementById('curUnit').textContent = `/ ${fmtNum(p.goal.target)} ${p.goal.unit}`;
  refresh(curForm, 'curSubmit'); curDlg.showModal(); F(curForm,'current').focus();
}
curForm.addEventListener('input', () => refresh(curForm, 'curSubmit'));
curForm.addEventListener('submit', e => {
  e.preventDefault();
  if(!curForm.reportValidity()) return;
  const p = cur(), v = parseFloat(F(curForm,'current').value);
  const wasReached = typeof p.goal.current === 'number' && p.goal.current >= p.goal.target;
  p.goal.current = v;
  curDlg.close(); fx = true; save(); render();
  if(v >= p.goal.target && !wasReached){ burst(innerWidth / 2, innerHeight / 3); toast('总体目标已达成'); }
});

/* 逾期处理：改期 / 放弃（原因必填，至少 2 个字） */
const resDlg = document.getElementById('resDlg'), resForm = document.getElementById('resForm');
const abandonDlg = document.getElementById('abandonDlg'), abandonForm = document.getElementById('abandonForm');
let actId = null;
const reasonOk = form => F(form,'reason').value.trim().length >= 2;
const refreshRes = () => { document.getElementById('resSubmit').disabled = !(resForm.checkValidity() && reasonOk(resForm)); };
const refreshAbandon = () => { document.getElementById('abandonSubmit').disabled = !(abandonForm.checkValidity() && reasonOk(abandonForm)); };
function openResDlg(id){
  const p = byId(id); if(!p || !p.current) return;
  actId = id; resForm.reset();
  F(resForm,'deadline').min = todayISO();
  const late = -daysLeft(p.current.deadline);
  document.getElementById('resLead').textContent = `「${p.current.what}」原定 ${fmtDate(p.current.deadline)}${late > 0 ? `，已逾期 ${late} 天` : ''}。改期会记在这一步上。`;
  refreshRes(); resDlg.showModal(); F(resForm,'deadline').focus();
}
function openAbandonDlg(id){
  const p = byId(id); if(!p || !p.current) return;
  actId = id; abandonForm.reset();
  document.getElementById('abandonLead').textContent = `「${p.current.what}」会记入已完成记录并标为已放弃。`;
  refreshAbandon(); abandonDlg.showModal(); F(abandonForm,'reason').focus();
}
resForm.addEventListener('input', refreshRes);
abandonForm.addEventListener('input', refreshAbandon);
resForm.addEventListener('submit', e => {
  e.preventDefault();
  if(!resForm.reportValidity() || !reasonOk(resForm)) return;
  const p = byId(actId); if(!p || !p.current) return;
  const c = p.current, to = F(resForm,'deadline').value;
  c.reschedules = [...(Array.isArray(c.reschedules) ? c.reschedules : []), {from:c.deadline, to, reason:F(resForm,'reason').value.trim(), at:todayISO()}];
  c.deadline = to;
  resDlg.close(); fx = true; save(); render();
  toast(`已改期到 ${fmtDate(to)}，记录在这一步上`);
});
abandonForm.addEventListener('submit', e => {
  e.preventDefault();
  if(!abandonForm.reportValidity() || !reasonOk(abandonForm)) return;
  const p = byId(actId); if(!p || !p.current) return;
  const prev = p.current, rec = {...p.current, doneAt:todayISO(), outcome:'abandoned', reason:F(abandonForm,'reason').value.trim()};
  p.history.push(rec); p.current = null;
  abandonDlg.close(); fx = true; save(); render();
  toast('这一步已放弃，记录已保留', () => { p.history = p.history.filter(h => h.id !== rec.id); p.current = prev; fx = true; save(); render(); });
});

/* 结束项目：完成 / 放弃 + 一句复盘，结束即归档 */
const endDlg = document.getElementById('endDlg'), endForm = document.getElementById('endForm');
let endId = null;
function endOutcome(){ return endForm.querySelector('input[name="outcome"]:checked')?.value || ''; }
function refreshEnd(){
  const r = F(endForm, 'review'), o = endOutcome();
  r.setCustomValidity(r.value.trim().length >= 2 ? '' : '至少写两个字');
  r.placeholder = o === 'dropped' ? '为什么停，学到了什么' : '最有效的一件事是什么，下次还这么做';
  endForm.querySelectorAll('.quick-opt').forEach(l => l.setAttribute('aria-checked', String(l.querySelector('input').checked)));
  document.getElementById('endSubmit').disabled = !(o && endForm.checkValidity());
}
function openEndDlg(id){
  const p = byId(id); if(!p) return;
  endId = id; endForm.reset();
  const g = p.goal || {}, doneSteps = p.history.filter(h => h.outcome !== 'abandoned').length;
  const parts = [goalSet(g) ? `目标 ${typeof g.current === 'number' ? fmtNum(g.current) : '未记录'} / ${fmtNum(g.target)} ${g.unit}` : '未设目标',
    p.roadmap.length ? `路线 ${p.roadmap.filter(m => m.status === 'done').length} / ${p.roadmap.length} 阶段` : '',
    doneSteps ? `完成 ${doneSteps} 步` : ''];
  document.getElementById('endLead').textContent = parts.filter(Boolean).join(' · ');
  document.getElementById('endCurrent').hidden = !p.current;
  if(canClose(p)) endForm.querySelector('input[value="done"]').checked = true;
  F(endForm, 'review').value = p.review || '';
  refreshEnd(); endDlg.showModal();
}
endForm.addEventListener('input', refreshEnd);
endForm.addEventListener('change', refreshEnd);
endForm.addEventListener('submit', e => {
  e.preventDefault();
  refreshEnd();
  const o = endOutcome(), p = byId(endId);
  if(!o || !endForm.checkValidity() || !p) return;
  const prev = {status:p.status, endedAt:p.endedAt, review:p.review};
  p.status = o; p.endedAt = todayISO(); p.review = F(endForm, 'review').value.trim();
  endDlg.close(); fx = true; save(); render();
  if(o === 'done') burst(innerWidth / 2, innerHeight / 3);
  toast(o === 'done' ? '项目已完成，移入已归档' : '项目已放弃，移入已归档', () => {
    for(const k of ['status', 'endedAt', 'review']){ if(prev[k] === undefined) delete p[k]; else p[k] = prev[k]; }
    fx = true; save(); render();
  });
});

/* 提示条（可撤销） */
let toastTimer;
function toast(msg, undo){
  const box = document.getElementById('toast'), btn = document.getElementById('toastUndo');
  clearTimeout(toastTimer);
  document.getElementById('toastMsg').textContent = msg;
  btn.hidden = !undo;
  btn.onclick = () => { box.hidden = true; undo && undo(); };
  box.hidden = false;
  toastTimer = setTimeout(() => { box.hidden = true; }, undo ? 8000 : 3200);
}

document.getElementById('stepDelete').addEventListener('click', () => {
  const p = cur(); if(!p || !p.current) return;
  const step = p.current; p.current = null; stepDlg.close();
  trashAndToast('step', step, {projectId:p.id});
});

document.getElementById('nav').addEventListener('click', e => {
  if(e.target.closest('[data-toggle="archived"]')){ showArchived = !showArchived; renderNav(); return; }
  const b = e.target.closest('[data-sel]'); if(!b) return;
  selectedId = b.dataset.sel; localStorage.setItem(SEL_KEY, selectedId); fx = true; render();
  window.scrollTo({top:0});
});

main.addEventListener('click', e => {
  const t = e.target.closest('[data-act]'); if(!t) return;
  const act = t.dataset.act;
  if(act === 'newProject'){ openProjectDlg('create'); return; }
  if(act === 'openProject'){ if(byId(t.dataset.id)) goProject(t.dataset.id); return; }
  // 今日页上的按钮带 data-id，可直接操作任一项目；项目页按钮不带，操作当前项目
  const p = (t.dataset.id && byId(t.dataset.id)) || cur(); if(!p) return;
  if(act === 'editGoal') openProjectDlg('goal');
  else if(act === 'updateCurrent') openCurDlg();
  else if(act === 'newStep'){ if(p !== cur()) goProject(p.id); openStepDlg('new'); }
  else if(act === 'editStep') openStepDlg('edit');
  else if(act === 'endProject') openEndDlg(p.id);
  else if(act === 'reopenProject'){ p.status = 'active'; p.endedAt = ''; fx = true; save(); render(); toast('已恢复为进行中'); }
  else if(act === 'extendGoal'){ if(p !== cur()) goProject(p.id); openProjectDlg('goal'); }
  else if(act === 'rescheduleStep') openResDlg(p.id);
  else if(act === 'abandonStep') openAbandonDlg(p.id);
  else if(act === 'doneStep'){
    if(!p.current) return;
    const r = t.getBoundingClientRect(); burst(r.left + r.width / 2, r.top + r.height / 2);
    const prev = p.current, done = {...p.current, doneAt: todayISO(), outcome:'done'};
    p.history.push(done); p.current = null;
    fx = true; save(); render();
    toast('这一步已完成，记录已保留', () => { p.history = p.history.filter(h => h.id !== done.id); p.current = prev; fx = true; save(); render(); });
  }
  else if(act === 'cycle'){
    const m = p.roadmap.find(x => x.id === t.dataset.mid);
    m.status = STATUS[(STATUS.indexOf(m.status)+1) % STATUS.length];
    if(m.status === 'done') m.doneAt = todayISO(); else if(m.doneAt) m.doneAt = '';
    lastMid = m.id; save(); render();
  }
  else if(act === 'addMs'){
    const m = {id:uid(), title:'', desc:'', status: p.roadmap.length ? 'pending' : 'active'};
    p.roadmap.push(m); save(); render();
    main.querySelector(`[data-ed="msTitle"][data-mid="${esc(m.id)}"]`)?.focus();
  }
  else if(act === 'delMs'){
    const index = p.roadmap.findIndex(x => x.id === t.dataset.mid); if(index < 0) return;
    const [m] = p.roadmap.splice(index, 1);
    trashAndToast('stage', m, {projectId:p.id, index});
  }
  else if(act === 'delHist'){
    const index = p.history.findIndex(h => h.id === t.dataset.hid); if(index < 0) return;
    const [h] = p.history.splice(index, 1);
    trashAndToast('history', h, {projectId:p.id, index});
  }
  else if(act === 'toggleHist'){ p._all = !p._all; render(); }
  else if(act === 'delProject'){
    const index = projects.indexOf(p);
    projects = projects.filter(x => x !== p);
    selectedId = live()[0]?.id || 'daily';   // 停在剩下的第一个进行中项目（现有测试“删除后回到剩余项目”依赖此行为）
    trashAndToast('project', p, {index}, '项目已移到回收站');
  }
});

/* 清单交互（每日 / 每周 / 每晚）：每日按钮不带 data-list，默认 daily */
main.addEventListener('click', e => {
  const open = e.target.closest('[data-lopen]');
  if(open){ const k = open.dataset.lopen; listOpen[k] = !listOpen[k]; render(); return; }
  const t = e.target.closest('[data-dact]'); if(!t) return;
  const kind = t.dataset.list || 'daily', L = listOf(kind), id = t.dataset.did, key = LISTS[kind].key();
  if(t.dataset.dact === 'toggle'){
    const before = kind === 'daily' ? dailyStats().complete : listStats(kind).complete;
    const set = new Set(L.log[key]?.done || []);
    set.has(id) ? set.delete(id) : set.add(id);
    L.log[key] = {done:[...set], total:L.items.length};
    const cutoff = addDays(todayISO(), -LISTS[kind].keep);
    Object.keys(L.log).forEach(k => { if(k < cutoff) delete L.log[k]; });
    if(kind === 'weekly') listOpen.weekly = false;   // 再次全部完成时自动收起
    save(); render();
    const after = kind === 'daily' ? dailyStats().complete : listStats(kind).complete;
    if(after && !before && kind !== 'nightly'){ burst(innerWidth / 2, innerHeight / 3); toast(kind === 'daily' ? '今日必做全部完成' : '本周必做全部完成'); }
  } else if(t.dataset.dact === 'del'){
    const index = L.items.findIndex(i => i.id === id); if(index < 0) return;
    const [item] = L.items.splice(index, 1);
    if(L.log[key]) L.log[key].done = L.log[key].done.filter(x => x !== id);   // 只抹当期勾选，历史记录保留
    syncTotal(kind);
    trashAndToast(kind, item, {index});
  } else if(t.dataset.dact === 'link'){
    const item = L.items.find(i => i.id === id); if(!item) return;
    const v = prompt('链接（留空清除）', item.url || '');
    if(v === null) return;
    const u = v.trim();
    if(u && !/^https?:\/\//.test(u)){ toast('链接需以 http:// 或 https:// 开头'); return; }
    item.url = u; save(); render();
  }
});
main.addEventListener('submit', e => {
  const f = e.target; if(!f.classList || !f.classList.contains('dadd')) return;
  e.preventDefault();
  const kind = f.dataset.list || 'daily', L = listOf(kind);
  const input = document.getElementById(kind + 'AddInput'), v = input.value.trim();
  if(!v) return;
  const item = {id:uid(), text:v, createdAt:todayISO()};
  if(kind === 'nightly'){
    const u = document.getElementById('nightlyAddUrl').value.trim();
    if(u && !/^https?:\/\//.test(u)){ toast('链接需以 http:// 或 https:// 开头'); return; }
    item.url = u;
  }
  L.items.push(item);
  syncTotal(kind); save(); render();
  document.getElementById(kind + 'AddInput')?.focus();
});
/* 回收站页 */
main.addEventListener('click', e => {
  const t = e.target.closest('[data-tact]'); if(!t || t.disabled) return;
  if(t.dataset.tact === 'restore') restoreTrash(t.dataset.tid);
  else if(t.dataset.tact === 'purge'){
    const en = trash.find(x => x.id === t.dataset.tid); if(!en) return;
    if(!confirm(`彻底删除「${trashTitle(en)}」？删除后无法恢复。`)) return;
    trash = trash.filter(x => x !== en);
    purgeTrash();   // 彻底删除项目时，它在回收站里的阶段 / 下一步 / 记录一并清除
    save(); render();
  } else if(t.dataset.tact === 'clear'){
    if(!confirm(`清空回收站里的 ${trash.length} 项？清空后无法恢复。`)) return;
    trash = []; save(); render();
  }
});

main.addEventListener('keydown', e => {
  const t = e.target;
  if(e.key === 'Enter' && !e.shiftKey && t.matches('[data-ed="name"],[data-ed="msTitle"],[data-ed="dailyText"],[data-ed="listText"]')){ e.preventDefault(); t.blur(); }
  if(e.key === 'Escape' && t.matches('[data-ed]')) t.blur();
});
main.addEventListener('focusout', e => {
  const t = e.target; if(!t.matches || !t.matches('[data-ed]')) return;
  const text = (t.innerText !== undefined ? t.innerText : t.textContent).replace(/\n+$/,'').trim();
  const f = t.dataset.ed;
  if(f === 'dailyText' || f === 'listText'){
    const item = listOf(t.dataset.list || 'daily').items.find(i => i.id === t.dataset.did); if(!item || item.text === text) return;
    item.text = text; save(); return;
  }
  const p = cur(); if(!p) return;
  if(f === 'msTitle' || f === 'msDesc'){
    const m = p.roadmap.find(x => x.id === t.dataset.mid); if(!m) return;
    if(f === 'msTitle'){ if(m.title === text) return; m.title = text; save(); render(); return; }
    m.desc = text;
  } else {
    if(p[f] === text) return;
    const healthBefore = health(p).text;
    p[f] = text;
    if(f === 'progress'){
      p.progressUpdatedAt = todayISO();
      const chips = main.querySelector('.ph .chips'); if(chips) chips.innerHTML = projectChips(p);
      const note = main.querySelector('[data-fresh-note]'); if(note) note.outerHTML = freshNote(p);
      if(health(p).text !== healthBefore) renderNav();   // 只在健康状态变化时重绘侧栏，避免吞掉紧接着的侧栏点击
    }
    if(f === 'blocker') t.closest('.callout')?.classList.toggle('on', text.length > 0);
    if(f === 'name'){ renderNav(); const c = main.querySelector('.crumb span'); if(c) c.textContent = text || '未命名项目'; }
  }
  save();
});

document.getElementById('newProjectBtn').addEventListener('click', () => openProjectDlg('create'));
document.getElementById('exportBtn').addEventListener('click', () => {
  const blob = new Blob([JSON.stringify({...stateObj(), exportedAt:new Date().toISOString()}, null, 2)], {type:'application/json'});
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = `工作台备份-${todayISO()}.json`;
  document.body.appendChild(a); a.click(); a.remove(); URL.revokeObjectURL(a.href);
});
document.getElementById('importBtn').addEventListener('click', () => document.getElementById('importFile').click());
document.getElementById('importFile').addEventListener('change', e => {
  const file = e.target.files[0]; if(!file) return;
  const r = new FileReader();
  r.onload = () => {
    try{
      const d = JSON.parse(r.result);
      const list = d && Array.isArray(d.projects) ? d.projects : null;
      if(!list) throw new Error('bad');
      if(confirm(`导入 ${list.length} 个项目，会覆盖当前全部内容，确定？`)){
        projects = list.map(normProject);
        daily = normList(d.daily) || daily;
        weekly = normList(d.weekly) || weekly;
        nightly = normList(d.nightly, {url:true}) || nightly;
        if(Array.isArray(d.trash)) trash = normTrash(d.trash);   // 旧备份不带这些键时保留当前值
        purgeTrash(); selectedId = 'daily'; fx = true; save(); render();
      }
    }catch(err){ alert('导入失败：文件不是有效的备份格式。'); }
  };
  r.readAsText(file); e.target.value = '';
});

const themeBtn = document.getElementById('themeBtn');
function applyTheme(t){
  if(t) document.documentElement.setAttribute('data-theme', t); else document.documentElement.removeAttribute('data-theme');
  const dark = getComputedStyle(document.documentElement).colorScheme === 'dark';
  themeBtn.innerHTML = ic(dark ? 'sun' : 'moon');
}
const themeParam = PARAMS.get('theme');   // ?theme=dark|light 供截图 / 演示强制主题
applyTheme(themeParam === 'dark' || themeParam === 'light' ? themeParam : (localStorage.getItem(THEME_KEY) || ''));
themeBtn.addEventListener('click', () => {
  const dark = getComputedStyle(document.documentElement).colorScheme === 'dark';
  const next = dark ? 'light' : 'dark';
  const apply = () => { localStorage.setItem(THEME_KEY, next); applyTheme(next); };
  if(reduced || typeof document.startViewTransition !== 'function'){
    document.documentElement.classList.add('theming'); apply();
    setTimeout(() => document.documentElement.classList.remove('theming'), 500);
    return;
  }
  const r = themeBtn.getBoundingClientRect(), x = r.left + r.width / 2, y = r.top + r.height / 2;
  const R = Math.hypot(Math.max(x, innerWidth - x), Math.max(y, innerHeight - y));
  const vt = document.startViewTransition(apply);
  vt.ready.then(() => document.documentElement.animate(
    {clipPath:[`circle(0px at ${x}px ${y}px)`, `circle(${R}px at ${x}px ${y}px)`]},
    {duration:700, easing:'cubic-bezier(.2,.7,.2,1)', pseudoElement:'::view-transition-new(root)'}
  ));
});

(function(){ const d = now(); document.getElementById('todayLine').textContent = `${d.getMonth()+1}月${d.getDate()}日 周${WEEK[d.getDay()]}`; })();

/* ================= 云端保存 ================= */
const API = 'https://liangzai666.com/workbench/api';
const AUTH_KEY = 'workbench.access';
const PENDING_KEY = 'workbench.cloud.pending';
const authDlg = document.getElementById('authDlg');
const authForm = document.getElementById('authForm');
let accessKey = localStorage.getItem(AUTH_KEY) || sessionStorage.getItem(AUTH_KEY) || '';
let revision = null, pendingState = null, syncing = false, syncTimer;
function syncStatus(text, retry=false, conflict=false){
  document.getElementById('saveText').textContent = text;
  document.getElementById('retrySync').hidden = !retry;
  document.getElementById('reloadCloud').hidden = !conflict;
}
async function api(method, state){
  const controller = new AbortController();
  const timer = setTimeout(() => controller.abort(), 15000);
  try{
    const response = await fetch(API + '/state', {
      method, signal:controller.signal, cache:'no-store',
      headers:{Authorization:'Bearer ' + accessKey, ...(state ? {'Content-Type':'application/json', 'If-Match':revision} : {})},
      ...(state ? {body:state} : {})
    });
    const data = await response.json();
    if(!response.ok){
      if(response.status === 401){ localStorage.removeItem(AUTH_KEY); sessionStorage.removeItem(AUTH_KEY); accessKey = ''; }
      throw Object.assign(new Error(data.error || '服务器暂时不可用'), {status:response.status});
    }
    // Nginx / CDN 压缩会给 ETag 添加 W/；数据版本不随传输编码改变。
    return {data, revision:response.headers.get('ETag')?.replace(/^W\//, '')};
  } finally { clearTimeout(timer); }
}
function rememberPending(){
  if(pendingState) localStorage.setItem(PENDING_KEY, JSON.stringify({state:pendingState, revision}));
  else localStorage.removeItem(PENDING_KEY);
}
function queueCloudSave(){
  pendingState = JSON.stringify(stateObj());
  rememberPending();
  clearTimeout(syncTimer);
  syncTimer = setTimeout(syncCloud, 350);
}
async function syncCloud(){
  if(syncing || !pendingState || !revision) return;
  syncing = true;
  syncStatus('正在保存到服务器…');
  try{
    while(pendingState){
      const snapshot = pendingState;
      const result = await api('PUT', snapshot);
      revision = result.revision;
      if(pendingState === snapshot) pendingState = null;
      rememberPending();
    }
    syncStatus('已保存到服务器 ' + new Date().toLocaleTimeString('zh-CN',{hour:'2-digit',minute:'2-digit'}));
  }catch(error){
    rememberPending();
    if(error.status === 401) showAuth(error.message);
    const message = error.status === 412 ? error.message : '未同步，修改已保存在本机。' + (error.status === 401 ? '请重新输入密钥。' : '请重试。');
    syncStatus(message, error.status !== 412, error.status === 412);
    toast(message);
  }finally{ syncing = false; }
}
async function loadCloud(){
  const result = await api('GET');
  revision = result.revision;
  const cached = JSON.parse(localStorage.getItem(PENDING_KEY) || 'null');
  if(cached?.revision) cached.revision = cached.revision.replace(/^W\//, '');
  pendingState = cached?.state || null;
  const src = pendingState ? JSON.parse(pendingState) : result.data;
  projects = src.projects.map(normProject);
  // 服务端没有某个清单或回收站时（旧服务端会丢弃未知顶层键），退回本机缓存里的值：不跨设备同步，但不丢
  let cache = null; try{ cache = JSON.parse(localStorage.getItem(CLOUD_CACHE_KEY) || 'null'); }catch(e){}
  daily = normList(src.daily) || normList(cache?.daily) || {items:[], log:{}};
  weekly = normList(src.weekly) || normList(cache?.weekly) || {items:[], log:{}};
  nightly = normList(src.nightly, {url:true}) || normList(cache?.nightly, {url:true}) || {items:[], log:{}};
  trash = Array.isArray(src.trash) ? normTrash(src.trash) : normTrash(cache?.trash);
  purgeTrash();
  if(pendingState && cached.revision !== revision){
    revision = cached.revision;
    syncStatus('服务器有新版本，本机修改尚未同步。请先导出再重新加载。', false, true);
  }else syncStatus('已连接服务器');
  if(!VIEWS.includes(selectedId) && !projects.some(p => p.id === selectedId)) selectedId = 'daily';
  localStorage.setItem(CLOUD_CACHE_KEY, JSON.stringify(stateObj()));
  localStorage.setItem(AUTH_KEY, accessKey);
  sessionStorage.removeItem(AUTH_KEY);
  authDlg.close();
  document.documentElement.classList.remove('cloud-locked');
  document.getElementById('lockBtn').hidden = false;
  fx = true; render();
  if(pendingState && cached.revision === result.revision) syncCloud();
}
function showAuth(message=''){
  document.getElementById('authError').textContent = message;
  if(!authDlg.open) authDlg.showModal();
}
authDlg.addEventListener('cancel', e => e.preventDefault());
authForm.addEventListener('submit', async e => {
  e.preventDefault();
  accessKey = document.getElementById('accessKey').value;
  document.getElementById('authSubmit').disabled = true;
  document.getElementById('authError').textContent = '';
  try{ await loadCloud(); }
  catch(error){ showAuth(error.status === 401 ? error.message : '连接失败，请稍后重试。'); }
  finally{ document.getElementById('authSubmit').disabled = false; }
});
document.getElementById('retrySync').addEventListener('click', () => {
  if(!accessKey) showAuth(); else syncCloud();
});
document.getElementById('reloadCloud').addEventListener('click', async () => {
  if(!confirm('先导出本机备份，再加载服务器最新内容？')) return;
  document.getElementById('exportBtn').click();
  localStorage.setItem('workbench.cloud.recovery', pendingState || '');
  pendingState = null; rememberPending();
  try{ await loadCloud(); }catch(error){ showAuth('连接失败，请重试。'); }
});
document.getElementById('lockBtn').addEventListener('click', () => {
  if(pendingState){ toast('请等修改同步成功后再锁定。'); return; }
  localStorage.removeItem(AUTH_KEY); sessionStorage.removeItem(AUTH_KEY); accessKey = '';
  document.getElementById('accessKey').value = '';
  document.documentElement.classList.add('cloud-locked'); showAuth();
});
window.addEventListener('beforeunload', e => {
  if(CLOUD && pendingState){ e.preventDefault(); e.returnValue = ''; }
});
purgeTrash();   // 读入后清除过期条目与孤儿子条目（只在内存里，下次保存时落盘）；云端模式在 loadCloud 里再清一次
render();
if(CLOUD){
  if(accessKey) loadCloud().catch(() => showAuth('请输入密钥重新连接。'));
  else showAuth();
}
</script>
